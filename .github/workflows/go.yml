name: Go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22.x", "1.23.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: go test ./irbis/...

      - name: Vet
        run: go vet ./irbis/...

      - name: Build examples (no external deps)
        run: |
          for d in examples/search_and_read examples/write_records \
                   examples/safe_experiments examples/direct_access \
                   examples/iso examples/mst2text examples/quintessence \
                   examples/rqst_shrink; do
            go build -o /dev/null "./$d"
          done
